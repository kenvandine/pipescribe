[package]
name = "scribe"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["whisper-rs/cuda"]

# Define the library target
[lib]
name = "scribe"
path = "src/lib.rs"

# Define the binary targets
[[bin]]
name = "scribe"
path = "src/main.rs"


[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
crossbeam-channel = "0.5.15"
env_logger = "0.11.8"
hound = "3.5.1"
libspa-sys = "0.8.0"
log = "0.4.27"
pipewire = "0.8.0"
pipewire-sys = "0.8.0"
regex = "1.11.1"
spa = "0.5.1"
tempfile = "3.19.1"
whisper-rs = {version = "0.14.2", features = ["log_backend"]}
gtk4 = "0.6.0"
